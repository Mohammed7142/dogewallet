<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogecoin Official Portal - الموقع الرسمي</title>
    <style>
        :root {
            --doge-gold: #cb9838;
            --doge-dark: #18191a;
            --doge-card: #242526;
            --text-main: #ffffff;
            --text-secondary: #b0b3b8;
        }
        body {
            background-color: var(--doge-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--doge-card);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--doge-gold);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            font-weight: bold;
            color: var(--doge-gold);
        }
        .logo span {
            font-size: 35px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .hero-card {
            background-color: var(--doge-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #333;
        }
        h1 {
            color: var(--doge-gold);
            margin-bottom: 10px;
        }
        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
        }
        .btn-official {
            background-color: var(--doge-gold);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-official:hover {
            background-color: #b0822a;
            transform: translateY(-2px);
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
            text-align: right;
        }
        .feature-box {
            background: #18191a;
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid var(--doge-gold);
        }
        .feature-box h4 {
            margin: 0 0 5px 0;
            color: var(--doge-gold);
            font-size: 14px;
        }
        .feature-box p {
            margin: 0;
            font-size: 12px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--doge-card);
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>🐕</span> Dogecoin Network
        </div>
        <div>
            <span style="background: rgba(203,152,56,0.2); color: var(--doge-gold); padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold;">الرسمي v2.0</span>
    </div>
    </header>

    <main>
        <div class="hero-card">
            <h1>البوابة الرسمية لشبكة Doge</h1>
            <p>منصة رقمية متكاملة تدار بأعلى معايير الأمان الموثوقة لخدمات المحافظ الرقمية والتحويلات اللامركزية.</p>
            
            <button class="btn-official" onclick="alert('جاري الانتقال لوحة التحكم الرئيسية والمحفظة الآمنة...')">دخول لوحة المحفظة</button>

            <div class="features">
                <div class="feature-box">
                    <h4>حماية فائقة</h4>
                    <p>تشفير متطور لبياناتك بالكامل.</p>
                </div>
                <div class="feature-box">
                    <h4>سرعة فائقة</h4>
                    <p>معاملات فورية بدون تأخير.</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        جميع الحقوق محفوظة لشبكة ومحفظة Doge &copy; 2026
    </footer>

</body>
</html>
