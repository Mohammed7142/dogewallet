<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogeWallet Pro - الموقع المركزي</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 85%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 16px;
        }
        button {
            background-color: #ffb300;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #ffa000;
        }
        .hidden { display: none; }
        .balance-box {
            background-color: #2c2c2c;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .amount {
            color: #ffb300;
            font-size: 28px;
            font-weight: bold;
        }
        .qr-placeholder {
            background: #fff;
            padding: 10px;
            display: inline-block;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .address {
            font-size: 13px;
            color: #aaa;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container" id="loginScreen">
        <h2>تسجيل الدخول 🔒</h2>
        <p style="color: #aaa; font-size: 14px;">أدخل اسم المستخدم للوصول للمحفظة المركزية</p>
        <input type="text" id="usernameInput" placeholder="اسم المستخدم...">
        <br>
        <button onclick="login()">دخول للمحفظة</button>
    </div>

    <div class="container hidden" id="walletScreen">
        <h2 id="welcomeText">مرحباً</h2>
        <div class="balance-box">
            <p style="margin: 0; color: #888;">الرصيد المركزي</p>
            <div class="amount">250.00 DOGE</div>
        </div>
        
        <div class="qr-placeholder">
            <!-- صورة رمز تعبيري مكان QR للسهولة الفورية -->
            <div style="font-size: 60px;">🐶</div>
        </div>

        <div class="address" id="walletAddress">D_CENTRALIZED_WEB_ADDRESS_999</div>
        <br><br>
        <button style="background-color: #444; color: #fff;" onclick="logout()">تسجيل خروج</button>
    </div>

    <script>
        function login() {
            const username = document.getElementById('usernameInput').value;
            if(username.trim() !== "") {
                document.getElementById('welcomeText').innerText = "مرحباً، " + username + " 🐶";
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('walletScreen').classList.remove('hidden');
            } else {
                alert("الرجاء إدخال اسم المستخدم");
            }
        }

        function logout() {
            document.getElementById('usernameInput').value = "";
            document.getElementById('walletScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
